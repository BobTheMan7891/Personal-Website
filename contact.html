    <main id="contact">

            <br>
            <h2 id="contact-me">Contact Me</h2>
            <br>

        <form action="https://formsubmit.co/oscarsutherland08@outlook.com" method="post">

            <div class="name-email-form">
                <p>
                    <label for="full-name">Full Name: *</label>
                    <br>
                    <input type="text" placeholder="John Smith" id="full-name" name="Name:" required>
                </p>
                <p>
                    <label for="email">Email: *</label>
                    <br>
                    <input type="text" placeholder="johnsmith@gmail.com" id="email" name="Email" required>
                </p>

            </div>

            <p>
                <label for="message">Message: *</label>
                <br>
                <textarea name="Message" id="message" placeholder="Enter you message..." required></textarea>
            </p>
            
            <nobr class="form-buttons">
                <input type="reset" class="input-button">
                <input type="submit" class="input-button">
            </nobr>

        </form>

        <br>
