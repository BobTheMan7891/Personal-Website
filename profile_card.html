<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Card</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    font-family: Arial, Helvetica, sans-serif;
  }

  .card {
    width: 500px;
    height: 420px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* top gradient banner with dotted texture */
  .banner {
    flex: 0 0 55%;
    position: relative;
    background: linear-gradient(120deg, #f3b6a8 0%, #dcb8d8 35%, #b9c3ea 70%, #a9c2ec 100%);
  }

  .banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.55) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    background-position: 10px 10px;
  }

  /* bottom dark panel */
  .info {
    flex: 1;
    background: #2b2b2b;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 0 0 28px 150px; /* left padding clears the avatar */
  }

  .name {
    color: #fff;
    font-size: 40px;
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  /* avatar overlapping both sections */
  .avatar {
    position: absolute;
    left: 24px;
    top: calc(55% - 65px); /* centers on the seam between banner and info */
    width: 130px;
    height: 130px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #2b2b2b;
    background: #7fd1c1; /* fallback if no image */
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="banner"></div>
    <div class="info">
      <div class="name">Oscar Sutherland</div>
    </div>
    <div class="avatar">
      <img src="https://via.placeholder.com/130" alt="avatar">
    </div>
  </div>

</body>
</html>
