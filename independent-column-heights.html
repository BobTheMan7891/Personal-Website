<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Independent per-cell heights per column</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
    font-family: sans-serif;
  }

  .header {
    height: 70px;
    background: #222;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 16px;
  }

  /* Outer wrapper: lays columns out side by side */
  .table {
    height: calc(100dvh - 70px);
    display: flex;
    flex-direction: row;
    width: 100%;
  }

  /* Each column manages its OWN vertical division —
     independent from the other columns */
  .col {
    display: flex;
    flex-direction: column;
    height: 100%;
    flex: 1; /* equal column widths, adjust as needed */
    border-right: 1px solid #ddd;
  }

  .col:last-child {
    border-right: none;
  }

  .cell {
    border-bottom: 1px solid #ddd;
    padding: 8px 16px;
    overflow: hidden;
  }

  /* Column 1: e.g. row3 = 10% */
  .col1 .cell:nth-child(1) { height: 30%; background: #f7f7f7; }
  .col1 .cell:nth-child(2) { height: 60%; background: #ffffff; }
  .col1 .cell:nth-child(3) { height: 10%; background: #f7f7f7; }

  /* Column 2: e.g. row3 = 50% — totally independent of column 1 */
  .col2 .cell:nth-child(1) { height: 20%; background: #f0f4ff; }
  .col2 .cell:nth-child(2) { height: 30%; background: #ffffff; }
  .col2 .cell:nth-child(3) { height: 50%; background: #f0f4ff; }

  /* Column 3: another independent split */
  .col3 .cell:nth-child(1) { height: 40%; background: #fff7f0; }
  .col3 .cell:nth-child(2) { height: 40%; background: #ffffff; }
  .col3 .cell:nth-child(3) { height: 20%; background: #fff7f0; }
</style>
</head>
<body>

  <div class="header">Header (70px fixed)</div>

  <div class="table">
    <div class="col col1">
      <div class="cell">Col 1 / Row 1 — 30%</div>
      <div class="cell">Col 1 / Row 2 — 60%</div>
      <div class="cell">Col 1 / Row 3 — 10%</div>
    </div>
    <div class="col col2">
      <div class="cell">Col 2 / Row 1 — 20%</div>
      <div class="cell">Col 2 / Row 2 — 30%</div>
      <div class="cell">Col 2 / Row 3 — 50%</div>
    </div>
    <div class="col col3">
      <div class="cell">Col 3 / Row 1 — 40%</div>
      <div class="cell">Col 3 / Row 2 — 40%</div>
      <div class="cell">Col 3 / Row 3 — 20%</div>
    </div>
  </div>

</body>
</html>
